# Local dev: API + watcher against the Firestore emulator.
# Production: drop the emulator, unset FIRESTORE_EMULATOR_HOST and provide
# FIREBASE_SERVICE_ACCOUNT_JSON. Run the watcher somewhere other than Render.
services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081 --project=${FIREBASE_PROJECT_ID:-render-watcher-dev}
    ports: ["8081:8081"]

  api:
    build: .
    env_file: .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8081
    ports: ["8080:8080"]
    depends_on: [firestore]

  watcher:
    build: .
    command: ["python", "-m", "app.watcher"]
    env_file: .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8081
    depends_on: [firestore]
    restart: unless-stopped
