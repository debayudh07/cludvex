# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets are `sync: false`, so Render prompts for them on first deploy.
envVarGroups:
  - name: render-watcher-shared
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRIAGE_MODEL
        value: gemini-3.8-flash
      - key: VERIFIER_MODEL
        value: gemini-3.8-flash
      - key: ACTIONS_ENABLED
        value: "false"
      - key: WATCH_POLL_SECONDS
        value: "60"
      - key: MAX_WATCHED_SERVICES
        value: "3"

services:
  - type: web
    name: render-watcher-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildFilter:
      paths: ["backend/**", "Dockerfile", ".dockerignore"]
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Free tier: the watcher runs inside the API and keeps it awake via
      # RENDER_EXTERNAL_URL. Set false if you move the watcher to its own
      # worker or VM (`python -m app.watcher`), or both will poll.
      - key: RUN_WATCHER_IN_API
        value: "true"
      - fromGroup: render-watcher-shared
